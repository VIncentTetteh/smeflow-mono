apiVersion: apps/v1
kind: Deployment
metadata:
  name: smeflow-api
  labels:
    app: smeflow-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smeflow-api
  template:
    metadata:
      labels:
        app: smeflow-api
    spec:
      serviceAccountName: smeflow-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema-check
          image: ghcr.io/smeflow/api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "scripts.check_schema"]
          envFrom:
            - secretRef:
                name: smeflow-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/smeflow/api:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - apps.api.main:app
            - -k
            - uvicorn.workers.UvicornWorker
            - -w
            - "4"
            - --bind
            - 0.0.0.0:8000
            - --timeout
            - "30"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: smeflow-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smeflow-api
  labels:
    app: smeflow-api
spec:
  selector:
    app: smeflow-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smeflow-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smeflow-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
