apiVersion: batch/v1
kind: Job
metadata:
  name: smeflow-api-migrate
  labels:
    app: smeflow-api
    job: migrate
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: smeflow-api
        job: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: smeflow-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/smeflow/api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: smeflow-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
