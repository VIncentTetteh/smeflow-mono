apiVersion: apps/v1
kind: Deployment
metadata:
  name: smeflow-celery-worker
  labels:
    app: smeflow-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smeflow-celery-worker
  template:
    metadata:
      labels:
        app: smeflow-celery-worker
    spec:
      serviceAccountName: smeflow-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema-check
          image: ghcr.io/smeflow/api:sha-placeholder
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "scripts.check_schema"]
          envFrom:
            - secretRef:
                name: smeflow-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: ghcr.io/smeflow/api:sha-placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - celery
            - -A
            - apps.api.workers.celery_app.celery
            - worker
            - --loglevel=INFO
            - --queues=default,invoicing,payments,credit,notifications,billing
          envFrom:
            - secretRef:
                name: smeflow-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A apps.api.workers.celery_app.celery inspect ping -d "celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A apps.api.workers.celery_app.celery inspect ping -d "celery@$HOSTNAME"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: smeflow-celery-worker
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: smeflow-celery-worker
