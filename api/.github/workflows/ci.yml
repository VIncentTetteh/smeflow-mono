name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: postgresql+asyncpg://smeflow:smeflow@localhost:5432/smeflow_test
  TEST_DATABASE_URL: postgresql+asyncpg://smeflow:smeflow@localhost:5432/smeflow_test
  REDIS_URL: redis://localhost:6379/0
  RABBITMQ_URL: amqp://guest:guest@localhost:5672/
  CELERY_RESULT_BACKEND: redis://localhost:6379/4
  SECRET_KEY: ci-test-secret-key-not-for-production-use-only
  APP_ENV: test

permissions:
  contents: read
  packages: write

jobs:
  # ── Lint & Format ───────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check apps/ libs/

      - name: Ruff format check
        run: uv run ruff format --check apps/ libs/

  # ── Type Check ──────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: mypy
        run: uv run mypy apps/api/core apps/api/modules/auth apps/api/modules/business --ignore-missing-imports

  # ── Security Scan ───────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Bandit scan
        run: bandit -r apps/api -ll --exclude apps/api/tests -q

      # Phase 6: Enhanced security scanning
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Dependency vulnerability scan
        run: |
          pip install safety
          safety check --full-report

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: smeflow
          POSTGRES_PASSWORD: smeflow
          POSTGRES_DB: smeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smeflow -d smeflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run unit tests
        run: uv run pytest apps/api/tests/unit -v --cov=apps/api --cov-report=xml --cov-fail-under=70

      - name: Run integration tests
        run: uv run pytest apps/api/tests/integration -v

      # Phase 6: Performance testing
      - name: Run load tests
        run: |
          pip install locust
          locust --headless --users 10 --spawn-rate 2 --run-time 30s --host http://localhost:8000 -f apps/api/tests/load/locustfile.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push on non-main)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smeflow-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.STAGING_KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -f infra/k8s

      - name: Roll API image
        run: kubectl set image deployment/smeflow-api api=ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}

      - name: Roll worker image
        run: kubectl set image deployment/smeflow-celery-worker worker=ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}

  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.PROD_KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      # Phase 6: Canary deployment with rollback
      - name: Canary deployment (10% traffic)
        run: |
          kubectl apply -f infra/k8s/canary-deployment.yaml
          kubectl set image deployment/smeflow-api-canary api=ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}

      - name: Wait for canary health check
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/smeflow-api-canary
          sleep 60  # Allow traffic to flow

      - name: Run smoke tests against canary
        run: |
          CANARY_IP=$(kubectl get svc smeflow-api-canary -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -f http://$CANARY_IP/health || exit 1

      - name: Scale canary to 50%
        run: kubectl scale deployment smeflow-api-canary --replicas=2

      - name: Wait and validate 50% traffic
        run: sleep 120

      - name: Full production rollout
        run: |
          kubectl set image deployment/smeflow-api api=ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}
          kubectl scale deployment smeflow-api-canary --replicas=0

      - name: Roll worker image
        run: kubectl set image deployment/smeflow-celery-worker worker=ghcr.io/${{ github.repository_owner }}/smeflow-api:${{ github.sha }}

      - name: Post-deployment health check
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/smeflow-api
          kubectl run health-check --image=curlimages/curl --rm -i --restart=Never -- curl -f http://smeflow-api/health
