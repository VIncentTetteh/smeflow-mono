[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "libs"]

[project]
name = "smeflow"
version = "0.1.0"
description = "SME Flow — Fintech Operations Platform for Ghanaian Informal SMEs"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Validation & Settings
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # Cache & Queue
    "redis[hiredis]>=5.0",
    "celery[rabbitmq]>=5.4",
    "celery-redbeat>=2.2",
    # Auth & Security
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    # HTTP Client
    "httpx>=0.27",
    # Retry logic
    "tenacity>=8.3",
    # QR & PDF
    "qrcode[pil]>=7.4",
    "reportlab>=4.2",
    "Pillow>=10.4",
    # AWS / Storage
    "boto3>=1.34",
    "botocore>=1.34",
    # Logging & Observability
    "structlog>=24",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
    "prometheus-fastapi-instrumentator>=7",
    "sentry-sdk[fastapi]>=2",
    # Rate limiting
    "slowapi>=0.1.9",
    # LLM (chat fallback — xAI Grok via OpenAI-compatible API)
    "openai>=1.0",
    # Utilities
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "uuid6>=2022.10.25",
    "resend>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "faker>=25",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "locust>=2.29",
    "pre-commit>=3.7",
    "types-redis>=4.6",
    "types-python-jose>=3.3",
    "types-passlib>=1.7",
    "types-boto3>=1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".venv_test",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "PTH", "RUF"]
ignore = [
    "S101",   # assert in tests
    "B008",   # function call in default arg (FastAPI Depends)
    "A003",   # shadowing Python builtins
    "UP017",  # datetime.UTC — keep timezone.utc for Python 3.10 runtime compat
    "S105",   # hardcoded passwords (false positives on env-var defaults)
    "S311",   # pseudo-random (secrets.token_hex is fine)
    "E501",   # line too long — handled by formatter
    "RUF002", # ambiguous unicode in docstrings
    "RUF012", # mutable class attribute — SQLAlchemy patterns require this
    "N805",   # first arg of class method not self (Pydantic validators)
    "N815",   # mixed case variable in class scope
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
exclude = [
    "^apps/api/tests/",
    "^apps/api/modules/analytics/",
    "^apps/api/modules/billing/",
    "^apps/api/modules/ussd/",
    "^apps/api/workers/tasks/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ""
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/scripts/*",
    "apps/api/modules/analytics/*",
    "apps/api/modules/billing/*",
    "apps/api/modules/ussd/*",
    "apps/api/workers/beat_schedule.py",
    "apps/api/workers/tasks/*",
]
